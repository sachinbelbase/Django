{% load static %}

<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

     <title>
          {% block title %}
               Let's Learn Django
          {% endblock %}
     </title>
</head>
<body>
     <nav class="navbar md:navbar-expand bg-1">
  <div class="container-fluid">
    <a href="{% url 'tweet_list' %}" class="btn btn-solid theme-primary mx-2">Tweet Home</a>
    <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarDrawer" aria-controls="navbarDrawer" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon" aria-hidden="true"></span>
    </button>
    <dialog class="drawer drawer-end" tabindex="-1" id="navbarDrawer" aria-labelledby="navbarDrawerLabel">
      <div class="drawer-header">
        <h5 class="drawer-title" id="navbarDrawerLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
      </div>
      <div class="drawer-body mb-2 md:mb-0">
        <ul class="nav navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">Link</a>
          </li>
          <li class="nav-item">
            <button class="nav-link" type="button" data-bs-toggle="menu" aria-expanded="false">
              Menu
            </button>
            <div class="menu">
              <a class="menu-item" href="#">Action</a>
              <a class="menu-item" href="#">Another action</a>
              <hr class="menu-divider">
              <a class="menu-item" href="#">Something else here</a>
            </div>
          </li>
          <li class="nav-item">
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
          </li>
        </ul>
        <form method="GET" action="{% url 'tweet_list' %}" class="hstack gap-2" role="search">
          <input id="searchInput" class="form-control" type="search" placeholder="Search" aria-label="Search" name="search" value="{{request.GET.search}}"/>
          <button class="btn-solid theme-success" type="submit">Search</button>
        </form>

        {% if user.is_authenticated %}

        <form method="POST" action="{% url 'logout' %}">
          {% csrf_token %}

          <button class="btn btn-solid theme-danger" type="submit">Logout</button>
        </form>
        {% else %}
        <a href="{% url 'register' %}" class="btn btn-solid theme-primary mx-2">Register</a>
        <a href="{% url 'login' %}" class="btn btn-solid theme-success mx-2">Login</a>
        {% endif %}
        

      </div>
    </dialog>
  </div>
</nav>
     <div class='container'>
          {% block content %}

          {% endblock %}
     </div>

     <script>
      const input = document.getElementById('searchInput');
      let timer;
      input.addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(() => input.form.submit(), 500);
      });
    </script>
</body>
</html>
